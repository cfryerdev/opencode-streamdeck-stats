name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure npm for OIDC trusted publishing
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set //registry.npmjs.org/:always-auth false

      - name: Install dependencies
        run: npm ci

      - name: Release to GitHub and npm
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
