name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Configure npm for OIDC trusted publishing
        run: |
          sed -i '' '/_authToken/d' ~/.npmrc || sed -i '/_authToken/d' ~/.npmrc || true
          cat ~/.npmrc || true

      - name: Install dependencies
        run: npm ci

      - name: Release to GitHub and npm
        run: npm run release -- --debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          DEBUG: semantic-release:*
